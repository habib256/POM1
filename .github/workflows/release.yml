# Release packaging — build POM1 on each native OS and produce a distributable
# that BUNDLES the cc65 toolchain so the in-app DevBench (Pom1BenchHost) compiles
# both of its native languages out of the box, with no system cc65 on PATH:
#
#   asm  →  ca65 + ld65
#   C    →  cl65 + cc65  (+ the share/cc65 runtime, resolved via CC65_HOME)
#
# cc65 binaries can't be cross-built, so there is one native job per target: Linux
# x86_64, Linux aarch64 (Raspberry Pi — its own GLES build, see the `raspberry`
# job), macOS and Windows. Each job stages the toolchain, runs the matching
# packager in STRICT mode (POM1_REQUIRE_CC65=1 → the packager fails if cc65 didn't
# make it in), verifies the staged tree, and uploads the artifact. On a version tag
# the four packages (plus a SHA256SUMS.txt manifest) are attached to the GitHub
# Release.
#
# Triggers: push a version tag to cut a release; "Run workflow" for a dry run
# (artifacts only, no Release). Both tag conventions used on this repo fire:
# the `v`-prefixed form (v1.8.6) AND the bare numeric form (1.9.2, 1.9.0) — the
# two most recent releases were tagged WITHOUT the `v`, so a `v*`-only filter
# would have skipped them.
name: Release packages

on:
  push:
    tags:
      - 'v[0-9]*'        # v1.9.2
      - '[0-9]*'         # 1.9.2  (bare numeric tag — current convention)
  workflow_dispatch:

permissions:
  contents: write          # publish job attaches packages to the Release

env:
  POM1_REQUIRE_CC65: "1"   # every packager must end with a verified asm+C cc65 bundle
  IMGUI_TAG: v1.92.7       # pinned Dear ImGui release (matches ci.yml)

jobs:
  # ---------------------------------------------------- normalize version ----
  # Single source of truth for the package version. Strips a leading `v` from
  # the tag so the value is the bare number (1.9.2) regardless of which tag
  # convention was pushed (v1.9.2 vs 1.9.2) — each packager prepends its own
  # `v`, so without this a v-prefixed tag would yield POM1-macOS-vv1.9.2.dmg.
  # Empty on workflow_dispatch (no tag) → packagers fall back to their default.
  version:
    runs-on: ubuntu-latest
    outputs:
      pom1_version: ${{ steps.v.outputs.pom1_version }}
    steps:
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$REF_TYPE" = "tag" ]; then
              echo "pom1_version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
              echo "pom1_version=" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- Linux ----
  # The AppImage is built INSIDE the pinned bionic (glibc 2.27) builder image so
  # it links against glibc 2.27 and runs on Linux Mint 19.x and everything newer
  # (an AppImage never bundles glibc, so its floor == the build image's glibc;
  # building on ubuntu-latest previously stamped GLIBC_2.34 and broke pre-2.34
  # systems). The toolchain is FROZEN in ghcr.io/<owner>/pom1-bionic-builder
  # (packaging/linux/Dockerfile.bionic, built by the build-bionic-image workflow)
  # so this job downloads no toolchain and never touches bionic's flaky EOL apt
  # mirrors — reproducible by image digest. Build that image first if it's missing.
  #
  # `docker run` rather than a `container:` key because GitHub's node24 actions
  # (checkout@v5, upload-artifact@v5) need glibc >= 2.28 — one notch above bionic's
  # 2.27 — so they can't run inside a bionic `container:`. Actions run on the host;
  # the repo is bind-mounted in. Full recipe: packaging/linux/build_in_bionic.sh.
  linux:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read          # pull the builder image from GHCR
    env:
      # PINNED BY DIGEST for reproducibility — this exact frozen toolchain, not a
      # moving tag. After rebuilding via the build-bionic-image workflow, re-pin to
      # the new digest it prints (the `:bionic` tag still moves for convenience).
      BUILDER_IMAGE: ghcr.io/habib256/pom1-bionic-builder@sha256:c44b786517f041f779b082b813e84a17b141db3983fc0b28f2c3e4deedeb4cca
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR (pull the builder image)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build POM1 + AppImage in the pinned bionic builder (cc65 bundled, strict)
        env:
          POM1_VERSION: ${{ needs.version.outputs.pom1_version }}
        run: |
          # Lowercase the owner — GHCR repositories must be lowercase.
          IMAGE="$(echo "$BUILDER_IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker pull "$IMAGE"
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e POM1_VERSION -e POM1_REQUIRE_CC65 -e IMGUI_TAG \
            "$IMAGE" \
            bash /work/packaging/linux/build_in_bionic.sh

      - name: Verify cc65 inside the staged AppDir (asm + C)
        run: tools/verify_cc65_bundle.sh build-appimage/AppDir/usr/share/POM1/cc65

      - name: Verify the AppImage — glibc floor <= 2.27 AND ET_EXEC runtime
        run: |
          set -euo pipefail
          # appimagetool emits a 0755 (world-readable/executable) file; it is
          # root-owned here because the build ran as root in the container, so we
          # only read/execute it — never chmod (would EPERM as the runner user).
          APP=$(ls dist/*.AppImage | head -1)
          # The runtime must be ELF ET_EXEC (not the new static-pie ET_DYN) or
          # AppImageLauncher rejects it as "type -1" — this is the regression the
          # AppImageKit appimagetool switch fixed; assert it never comes back.
          TYPE=$(readelf -h "$APP" | awk -F'[ :]+' '/^ *Type:/ {print $3; exit}')
          echo "AppImage runtime ELF type: ${TYPE}"
          test "$TYPE" = "EXEC" \
            || { echo "ERROR: AppImage runtime is $TYPE, not EXEC — AppImageLauncher will reject it"; exit 1; }
          # Magic AI\x02 at offset 8 = valid AppImage type 2.
          MAGIC=$(xxd -s 8 -l 3 -p "$APP")
          test "$MAGIC" = "414902" \
            || { echo "ERROR: bad AppImage magic $MAGIC (expected 414902)"; exit 1; }
          "$APP" --appimage-extract >/dev/null
          BIN=squashfs-root/usr/bin/POM1
          # Highest GLIBC_x.y version any symbol in the binary requires.
          MAX=$(objdump -T "$BIN" 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
                | sort -V | tail -1)
          echo "Highest glibc symbol required by POM1: ${MAX:-none}"
          # 2.27 is the bionic floor; anything higher would break Mint 19.x.
          test "$(printf '%s\nGLIBC_2.27\n' "$MAX" | sort -V | tail -1)" = "GLIBC_2.27" \
            || { echo "ERROR: AppImage requires ${MAX} > GLIBC_2.27"; exit 1; }
          echo "OK: ET_EXEC + magic + glibc floor <= 2.27"

      - name: Install runtime GL/X libs for the launch smoke
        run: |
          set -eu
          # The AppImage deliberately does NOT bundle libGL/libOpenGL (AppImage
          # rule: graphics-driver libs come from the HOST). A real desktop has
          # them; the headless runner does not, and they are DT_NEEDED — resolved
          # by the dynamic linker at exec, before main reaches --list-presets — so
          # POM1 dies with "libOpenGL.so.0: cannot open" (exit 127) without them.
          # No Xvfb/GPU needed: we exit before any GL context is created; the libs
          # only have to be loadable. glibc is forward-compatible, so the
          # 2.27-built binary loads fine against the runner's newer libraries.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libopengl0 libglx0 libgl1 \
            libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Smoke-launch the packaged AppImage (--list-presets)
        run: |
          set -euo pipefail
          # Structural checks above prove the file is SHAPED right; this proves it
          # actually RUNS — AppRun sets up the env and the bundled libs resolve at
          # glibc 2.27. --list-presets exits 0 before GLFW/any window, so it is
          # safe on a display-less runner. --appimage-extract-and-run drives the
          # real AppRun path without needing FUSE (unavailable on the runner).
          APP=$(ls dist/*.AppImage | head -1)
          OUT=$("$APP" --appimage-extract-and-run --list-presets)
          echo "$OUT"
          grep -q "Available machine presets:" <<<"$OUT" \
            || { echo "ERROR: AppImage did not print the preset table"; exit 1; }
          grep -q "Multiplexing Fantasy" <<<"$OUT" \
            || { echo "ERROR: preset table is empty/truncated (no Fantasy preset)"; exit 1; }
          echo "OK: packaged AppImage launches and lists presets"

      - uses: actions/upload-artifact@v5
        with:
          name: POM1-linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  # -------------------------------------------------- Raspberry Pi (arm64) ----
  # Same shape as the `linux` job, three differences that all follow from the
  # target being a Pi:
  #
  #   1. runs-on: ubuntu-24.04-arm — GitHub's NATIVE arm64 runner (free on
  #      public repos). No QEMU: this compiles at full speed, unlike the
  #      binfmt-emulated cross-build it replaces the need for.
  #   2. A debian:bookworm container, because Raspberry Pi OS is Debian bookworm
  #      and an AppImage never bundles glibc — its floor is the BUILD image's.
  #      Building on the runner's own ubuntu-24.04-arm userland would stamp
  #      GLIBC_2.39 and the package would not start on a single Pi. Bookworm's
  #      2.36 covers Pi OS bookworm + trixie and arm64 Ubuntu 24.04+.
  #   3. -DPOM1_GLES=ON (inside build_in_bookworm_arm64.sh) — Mesa's V3D caps
  #      *desktop* GL at 3.1 on Pi 4/5, so the default GL 3.2 core request fails
  #      outright. The GLES 3.0 / EGL tier is what the hardware exposes.
  #
  # There is deliberately no pinned builder image here (unlike bionic): bookworm
  # is a current, supported Debian whose mirrors are healthy, so `apt-get` in the
  # container is reliable. Freeze it into a GHCR image the day that stops being
  # true — the script is already shaped for it.
  raspberry:
    needs: version
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build POM1 + AppImage in a bookworm arm64 container (GLES, cc65 bundled, strict)
        env:
          POM1_VERSION: ${{ needs.version.outputs.pom1_version }}
        run: |
          docker run --rm \
            -v "$PWD":/work -w /work \
            -e POM1_VERSION -e POM1_REQUIRE_CC65 -e IMGUI_TAG \
            debian:bookworm \
            bash /work/packaging/linux/build_in_bookworm_arm64.sh

      - name: Verify cc65 inside the staged AppDir (asm + C)
        run: tools/verify_cc65_bundle.sh build-appimage/AppDir/usr/share/POM1/cc65

      - name: Verify the AppImage — aarch64, ET_EXEC, glibc floor <= 2.36, no desktop libGL
        run: |
          set -euo pipefail
          APP=$(ls dist/*.AppImage | head -1)
          echo "Package: $APP"
          # Name must carry the arch — the publish job flattens every artifact
          # into one directory, so an x86_64-named aarch64 build would silently
          # overwrite the Intel package.
          case "$APP" in
            *-aarch64.AppImage) ;;
            *) echo "ERROR: $APP is not named -aarch64.AppImage"; exit 1 ;;
          esac
          # Same ET_EXEC + magic contract as x86_64 (AppImageLauncher rejects
          # ET_DYN runtimes as "type -1").
          TYPE=$(readelf -h "$APP" | awk -F'[ :]+' '/^ *Type:/ {print $3; exit}')
          test "$TYPE" = "EXEC" \
            || { echo "ERROR: AppImage runtime is $TYPE, not EXEC"; exit 1; }
          MAGIC=$(xxd -s 8 -l 3 -p "$APP")
          test "$MAGIC" = "414902" \
            || { echo "ERROR: bad AppImage magic $MAGIC (expected 414902)"; exit 1; }
          "$APP" --appimage-extract >/dev/null
          BIN=squashfs-root/usr/bin/POM1
          MACH=$(readelf -h "$BIN" | awk -F': +' '/Machine:/ {print $2; exit}')
          echo "POM1 ELF machine: $MACH"
          grep -q AArch64 <<<"$MACH" \
            || { echo "ERROR: POM1 is not an AArch64 binary"; exit 1; }
          MAX=$(objdump -T "$BIN" 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
                | sort -V | tail -1)
          echo "Highest glibc symbol required by POM1: ${MAX:-none}"
          # 2.36 is the bookworm / Raspberry Pi OS floor.
          test "$(printf '%s\nGLIBC_2.36\n' "$MAX" | sort -V | tail -1)" = "GLIBC_2.36" \
            || { echo "ERROR: AppImage requires ${MAX} > GLIBC_2.36 — will not run on Pi OS"; exit 1; }
          # The GLES package must never pull desktop libGL: on a Pi that library
          # is the software rasteriser fallback, and depending on it would be a
          # silent 2 fps regression rather than a link error.
          if ldd "$BIN" | grep -qE 'lib(GL|OpenGL)\.so'; then
            echo "ERROR: packaged POM1 links desktop libGL"; ldd "$BIN" | grep -E 'GL|EGL'; exit 1
          fi
          ldd "$BIN" | grep -E 'GLES|EGL' || true
          echo "OK: aarch64 + ET_EXEC + magic + glibc floor <= 2.36 + GLES-only"

      - name: Install runtime GLES/X libs for the launch smoke
        run: |
          set -eu
          # DT_NEEDED libs are resolved at exec, before main reaches
          # --list-presets, so they must exist even though no context is created.
          # GLESv2/EGL here instead of libGL — this package's whole point.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgles2 libegl1 libglx0 \
            libx11-6 libxext6 libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Smoke-launch the packaged AppImage (--list-presets)
        run: |
          set -euo pipefail
          APP=$(ls dist/*.AppImage | head -1)
          OUT=$("$APP" --appimage-extract-and-run --list-presets)
          echo "$OUT"
          grep -q "Available machine presets:" <<<"$OUT" \
            || { echo "ERROR: AppImage did not print the preset table"; exit 1; }
          grep -q "Multiplexing Fantasy" <<<"$OUT" \
            || { echo "ERROR: preset table is empty/truncated (no Fantasy preset)"; exit 1; }
          echo "OK: packaged aarch64 AppImage launches and lists presets"

      - uses: actions/upload-artifact@v5
        with:
          name: POM1-raspberry-arm64-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

  # ---------------------------------------------------------------- macOS ----
  macos:
    needs: version
    # Intel build — runs on Apple Silicon via Rosetta too. macos-13 was retired
    # by GitHub (Dec 2025) and the label now queues forever (run 29819799811 sat
    # 24 h without a runner); macos-15-intel is the supported Intel image.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Install deps (glfw + cc65)
        run: brew install glfw cc65

      - name: Fetch Dear ImGui (pinned)
        run: git clone --depth 1 --branch "$IMGUI_TAG" https://github.com/ocornut/imgui.git

      - name: Stage cc65 bundle (asm ca65/ld65 + C cl65/cc65)
        run: tools/build_cc65_bundle.sh --out dist/cc65-bundle

      - name: Package .app + .dmg (cc65 bundled, strict)
        env:
          POM1_VERSION: ${{ needs.version.outputs.pom1_version }}
        run: ./package_macos_release.sh

      - name: Verify cc65 inside the staged .app (asm + C)
        run: tools/verify_cc65_bundle.sh dist/POM1.app/Contents/Resources/cc65

      - name: Smoke-launch the packaged .app binary (--list-presets)
        run: |
          set -euo pipefail
          # Proves the bundled binary starts and its dylibs (glfw, etc.) resolve.
          # --list-presets exits 0 before GLFW/any window, so no display is needed.
          OUT=$(dist/POM1.app/Contents/MacOS/POM1 --list-presets)
          echo "$OUT"
          grep -q "Available machine presets:" <<<"$OUT" \
            || { echo "ERROR: .app binary did not print the preset table"; exit 1; }
          grep -q "Multiplexing Fantasy" <<<"$OUT" \
            || { echo "ERROR: preset table is empty/truncated (no Fantasy preset)"; exit 1; }
          echo "OK: packaged .app binary launches and lists presets"

      - uses: actions/upload-artifact@v5
        with:
          name: POM1-macOS-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # -------------------------------------------------------------- Windows ----
  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Fetch Dear ImGui (pinned)
        run: git clone --depth 1 --branch ${{ env.IMGUI_TAG }} https://github.com/ocornut/imgui.git

      - name: Install GLFW via vcpkg
        run: vcpkg install glfw3:x64-windows

      - name: Install LLVM MinGW (compile cc65 from source)
        # winget is the flakiest step of the whole release: it talks to the
        # Microsoft Store source over the network and has failed with a bare
        # "exit code 1" on a runner where nothing else was wrong, costing a
        # full re-run. Retry three times with backoff before giving up, and
        # treat "already installed" (exit 0x8A15002B / -1978335189) as success
        # so a warm runner image doesn't fail the job either.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          for ($i = 1; $i -le 3; $i++) {
            winget install -e --id MartinStorsjo.LLVM-MinGW.UCRT `
                  --accept-package-agreements --accept-source-agreements
            $code = $LASTEXITCODE
            if ($code -eq 0 -or $code -eq -1978335189) {
              Write-Host "llvm-mingw ready (attempt $i, exit $code)"
              exit 0
            }
            Write-Host "winget attempt $i failed with exit $code; retrying…"
            Start-Sleep -Seconds (15 * $i)
          }
          Write-Error "winget could not install llvm-mingw after 3 attempts"
          exit 1

      - name: Stage cc65 bundle (compile from source; asm + C + ar65)
        shell: pwsh
        run: .\packaging\windows\build_cc65.ps1 -Out dist\cc65-bundle

      - name: Configure + build (Release, vcpkg toolchain)
        shell: cmd
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="%VCPKG_INSTALLATION_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
          cmake --build build --config Release -j

      - name: Package ZIP (cc65 bundled, strict)
        shell: cmd
        env:
          POM1_VERSION: ${{ needs.version.outputs.pom1_version }}
        run: |
          set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          set "CC65_HOME=%CD%\dist\cc65-bundle\cc65\share\cc65"
          call package_windows_release.bat

      - name: Verify cc65 inside the staged package (asm + C)
        shell: bash
        run: tools/verify_cc65_bundle.sh dist/POM1-Windows/cc65

      - name: Verify VC++ runtime is bundled app-local (base-Windows launch)
        shell: bash
        run: |
          set -eu
          for d in vcruntime140.dll vcruntime140_1.dll msvcp140.dll; do
            test -f "dist/POM1-Windows/$d" || { echo "MISSING app-local VC++ runtime: $d"; exit 1; }
          done
          echo "VC++ runtime bundled app-local: OK"

      - name: Smoke-launch the packaged POM1.exe (--list-presets)
        shell: bash
        run: |
          set -euo pipefail
          # POM1 is a console-subsystem exe, so stdout is captured here. Launching
          # from the package dir proves the app-local VC++ runtime DLLs resolve
          # (Windows searches the exe's own directory first). --list-presets exits
          # 0 before any window opens.
          OUT=$(dist/POM1-Windows/POM1.exe --list-presets)
          echo "$OUT"
          grep -q "Available machine presets:" <<<"$OUT" \
            || { echo "ERROR: POM1.exe did not print the preset table"; exit 1; }
          grep -q "Multiplexing Fantasy" <<<"$OUT" \
            || { echo "ERROR: preset table is empty/truncated (no Fantasy preset)"; exit 1; }
          echo "OK: packaged POM1.exe launches and lists presets"

      - uses: actions/upload-artifact@v5
        with:
          name: POM1-Windows-zip
          path: dist/*.zip
          if-no-files-found: error

  # ------------------------------------------------ attach to the Release ----
  publish:
    needs: [linux, raspberry, macos, windows]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Attach packages + checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # Flatten the per-job artifact dirs into one staging dir (clean basenames
          # so the checksum file lists e.g. "POM1-macOS-v1.9.2.dmg", not a nested
          # download path). Each package basename is already unique per OS.
          mkdir -p staging
          find artifacts -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.zip' \) \
               -exec cp -v {} staging/ \;
          shopt -s nullglob
          FILES=(staging/*.AppImage staging/*.dmg staging/*.zip)
          if [ "${#FILES[@]}" -eq 0 ]; then echo "No packages found to publish."; exit 1; fi
          # SHA-256 manifest so downloaders can verify integrity (sha256sum -c).
          # List only the basenames actually present (cd into staging so the
          # manifest carries bare filenames).
          ( cd staging && sha256sum -- "${FILES[@]#staging/}" > SHA256SUMS.txt )
          cat staging/SHA256SUMS.txt
          FILES+=(staging/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${FILES[@]}" --clobber
          else
              gh release create "$TAG" "${FILES[@]}" --generate-notes --title "POM1 $TAG"
          fi
