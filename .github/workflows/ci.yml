# Minimal CI: build POM1 on Linux, run the ctest suite (Klaus functional test +
# every smoke test + the GEN2 graphics-regression golden), and assemble all the
# dev/ 6502 projects. Single Linux job by design — see CLAUDE.md / TODO.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify the committed WASM cc65 toolchain is present
        run: tools/verify_wasm_cc65.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libglfw3-dev libgl1-mesa-dev cc65 \
                                  libgles2-mesa-dev libegl1-mesa-dev

      - name: Fetch Dear ImGui (pinned to the tested release)
        run: git clone --depth 1 --branch v1.92.7 https://github.com/ocornut/imgui.git

      - name: Build POM1
        run: |
          cmake -S . -B build
          cmake --build build -j"$(nproc)"

      - name: Compile the GL TUs the way Windows sees them (no glext.h)
        # The Windows SDK ships a GL 1.1 <GL/gl.h> and NO <GL/glext.h>, so the
        # shader/CRT translation units take a different include path there —
        # one that only the (slow, tag-only) release workflow used to exercise.
        # -DGL_GLEXT_LEGACY makes Mesa's gl.h skip glext.h, reproducing that
        # path here in seconds. Two Windows-only breakages shipped through this
        # blind spot before the gate existed (include order, then missing
        # glext.h), each costing a full release-workflow round trip.
        run: |
          for f in src/OpenGLShader.cpp src/CrtEffectStack.cpp; do
            g++ -std=c++17 -DGL_GLEXT_LEGACY -c "$f" -o /dev/null \
                -Isrc -Iimgui -Ibuild || exit 1
          done
          echo "OK: GL TUs compile without glext.h (Windows include path)"

      - name: Compile the GLES 3.0 tier (Raspberry Pi path)
        # -DPOM1_GLES=ON is what the `raspberry` release job builds, and that job
        # only runs on a tag — the same blind spot the Windows include-path gate
        # above exists to close. POM1_GL_ES flips the include selection, the
        # `#version 300 es` prologue and the direct-vs-glfwGetProcAddress entry
        # points in these four TUs, so a desktop-GL-only refactor can break the
        # Pi package without any x86 build noticing.
        #
        # Only the four affected objects are compiled (a full second build would
        # roughly double CI wall time for no extra coverage) — the convenience
        # targets `src/<name>.o` carry the exact flags CMake would use. Mesa
        # provides GLES 3.0 on x86_64 too, so no ARM hardware is needed to prove
        # the code compiles and links against libGLESv2/libEGL.
        run: |
          set -euo pipefail
          cmake -S . -B build-gles -DPOM1_GLES=ON -DPOM1_ENABLE_TESTS=OFF
          for f in OpenGLShader CrtEffectStack PomRenderer_GL main_imgui; do
            cmake --build build-gles --target "src/$f.o"
          done
          echo "OK: GLES 3.0 TUs compile"

      - name: Run ctest (Klaus, smoke tests, graphics regression)
        run: ctest --test-dir build --output-on-failure

      - name: Rebuild CodeTank cartridges (byte-identical gate)
        run: make -C dev/codetank

      - name: Assemble the standalone tool/game sketches
        run: |
          make -C sketchs/tms9918/tool_diapo
          make -C sketchs/tms9918/tool_tmsload
          make -C sketchs/tms9918/game_maze3d
