# apple1.cfg -- ld65 layout for EhBASIC on the Apple-1.
#
# The output file is a flat $5000-$7FFF image POM1 loads straight into RAM (it
# is NOT a ROM window -- see apple1.s). ZP and RAM carry no `file =` so nothing
# of them reaches the image; only ENTRY and CODE are emitted.
#
# ENTRY is pinned at $5000 and listed before CODE so the two entry JMPs stay at
# $5000/$5003 whatever the interpreter's size does.

MEMORY {
    ZP:    start = $0000, size = $0100, type = rw, file = "";
    RAM:   start = $0100, size = $4F00, type = rw, file = "";
    PROG:  start = $5000, size = $3000, type = ro, file = %O, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    BSS:      load = RAM,  type = bss;
    ENTRY:    load = PROG, type = ro, start = $5000;
    CODE:     load = PROG, type = ro;
}
